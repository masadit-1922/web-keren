<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Sayangku</title>
    <style>
        body {
            background-color: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #1976d2; }
        .heart { font-size: 70px; animation: pulse 1s infinite; color: #1976d2; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .btn {
            background-color: #1976d2;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 16px;
        }
        p { color: #555; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">💙</div>
        <h1>Sayang, maafin aku ya...</h1>
        <p>Jenyta Indana, aku beneran kangen sama senyum kamu.</p>
        <p>Aku janji bakal lebih dengerin kamu, jangan marah lama-lama ya sayang...</p>
        <button class="btn" onclick="alert('Makasih ya sayang udah maafin aku! Love you more!')">Aku udah maafin kamu</button>
    </div>
</body>
</html>
